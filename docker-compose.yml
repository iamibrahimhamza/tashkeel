services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tashkeel
      POSTGRES_PASSWORD: tashkeel
      POSTGRES_DB: tashkeel
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tashkeel"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: tashkeel
      MINIO_ROOT_PASSWORD: tashkeel-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  mailpit:
    image: axllent/mailpit:v1.24
    ports: ["1025:1025", "8025:8025"]

volumes:
  pgdata:
  miniodata:
